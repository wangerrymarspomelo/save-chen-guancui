<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>《拯救沉罐毳》</title>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
    color: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #000000;
  }
  .screen.active {
    display: flex;
  }

  /* ==================== 1. 開始畫面 ==================== */
  #startScreen {
    padding: 28px 22px;
    background: radial-gradient(circle at 50% 35%, #160808 0%, #050505 55%, #000000 100%);
    text-align: center;
  }
  .horror-badge {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #EF4444;
    border: 1px solid rgba(239, 68, 68, 0.45);
    background: rgba(127, 29, 29, 0.25);
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  .game-title {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #F8FAFC;
    text-shadow: 0 0 18px rgba(220, 38, 38, 0.55);
    margin-bottom: 14px;
  }
  .story-box {
    max-width: 380px;
    background: rgba(15, 15, 18, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 18px 18px;
    font-size: 15px;
    line-height: 1.75;
    color: #CBD5E1;
    margin-bottom: 24px;
    text-align: left;
  }
  .story-box p + p {
    margin-top: 10px;
  }
  .story-box b {
    color: #FCA5A5;
  }
  .rule-warn {
    color: #EF4444;
    font-weight: 800;
    font-size: 14px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed rgba(239, 68, 68, 0.35);
  }
  .btn-primary {
    width: 100%;
    max-width: 320px;
    padding: 16px 24px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #FFFFFF;
    background: linear-gradient(135deg, #B91C1C, #7F1D1D);
    border: 1.5px solid #EF4444;
    border-radius: 14px;
    box-shadow: 0 0 24px rgba(220, 38, 38, 0.4);
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .btn-primary:active {
    transform: scale(0.96);
    filter: brightness(1.15);
  }
  .sound-tip {
    margin-top: 14px;
    font-size: 12.5px;
    color: #64748B;
  }

  /* ==================== 2. 全黑尋人畫面 ==================== */
  #playScreen {
    background: #000000;
    cursor: crosshair;
  }
  .intro-prompt {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #E2E8F0;
    letter-spacing: 1.5px;
    line-height: 1.6;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  .intro-prompt.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* 極低調的剩餘次數提示，不提供任何空間線索 */
  .chances-hud {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: 700;
    color: rgba(185, 28, 28, 0.65);
    letter-spacing: 1px;
    pointer-events: none;
    z-index: 5;
  }

  /* ==================== 3. 女鬼 Jump Scare 全螢幕層 ==================== */
  .jumpscare-layer {
    position: fixed;
    inset: 0;
    background: #000000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    overflow: hidden;
  }
  .jumpscare-layer.active {
    display: flex;
    animation: bgFlash 0.14s infinite;
  }
  .jumpscare-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 32%;
    animation: jumpZoom 0.12s ease-out forwards, hardShake 0.08s infinite;
  }

  /* ==================== 4. 成功救援畫面 ==================== */
  #successScreen {
    padding: 24px 20px;
    background: radial-gradient(circle at 50% 35%, #272112 0%, #09090B 72%, #000000 100%);
    text-align: center;
  }
  .rescue-card {
    width: 100%;
    max-width: 390px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    animation: fadeUp 0.45s ease-out;
  }
  .rescue-photo-wrap {
    width: 100%;
    max-height: 55vh;
    aspect-ratio: 3 / 4;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid rgba(250, 204, 21, 0.6);
    box-shadow: 0 0 36px rgba(250, 204, 21, 0.25);
    background: #000000;
  }
  .rescue-photo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .rescue-title {
    font-size: 24px;
    font-weight: 900;
    color: #FDE047;
    line-height: 1.4;
    text-shadow: 0 2px 12px rgba(250, 204, 21, 0.35);
  }
  .rescue-sub {
    font-size: 14.5px;
    color: #CBD5E1;
  }
  .btn-success {
    width: 100%;
    max-width: 300px;
    padding: 14px 24px;
    font-size: 18px;
    font-weight: 900;
    color: #0F172A;
    background: linear-gradient(135deg, #FDE047, #F59E0B);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
  }
  .btn-success:active {
    transform: scale(0.96);
  }

  /* ==================== 5. 失敗畫面（3 次機會用盡） ==================== */
  #failScreen {
    padding: 28px 22px;
    background: radial-gradient(circle at 50% 40%, #2A0505 0%, #050505 70%, #000000 100%);
    text-align: center;
  }
  .fail-title {
    font-size: 32px;
    font-weight: 900;
    color: #EF4444;
    letter-spacing: 2px;
    margin-bottom: 12px;
    text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
  }
  .fail-desc {
    max-width: 340px;
    font-size: 15.5px;
    line-height: 1.7;
    color: #CBD5E1;
    margin-bottom: 26px;
  }

  /* ==================== 動畫關鍵影格 ==================== */
  @keyframes jumpZoom {
    0% { transform: scale(0.75); filter: brightness(2.2) contrast(1.5); }
    100% { transform: scale(1.18); filter: brightness(1.05) contrast(1.25); }
  }
  @keyframes hardShake {
    0%, 100% { translate: 0 0; }
    20% { translate: -14px 9px; }
    40% { translate: 15px -10px; }
    60% { translate: -12px -8px; }
    80% { translate: 12px 11px; }
  }
  @keyframes bgFlash {
    0%, 100% { background: #000000; }
    50% { background: #2A0000; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <!-- 1. 開始畫面 -->
  <section id="startScreen" class="screen active">
    <div class="horror-badge">極度黑暗 · 恐怖反應測試</div>
    <h1 class="game-title">拯救沉罐毳</h1>
    <div class="story-box">
      <p>沉罐毳本人膚色很黑，而且<b>非常怕黑</b>。</p>
      <p>現在他被困在一片伸手不見五指的黑暗裡，你必須在全黑的螢幕中點擊尋找他真正躲藏的位置。</p>
      <p class="rule-warn">⚠ 黑暗中藏著可怕的東西：你只有 3 次錯誤機會，點錯就會觸發恐怖女鬼；第 3 次失敗即救援結束！</p>
    </div>
    <button id="startBtn" class="btn-primary">開始救援 ▶</button>
    <div class="sound-tip">🔊 建議開啟手機音量以獲得完整驚悚體驗</div>
  </section>

  <!-- 2. 全黑尋人遊戲畫面 -->
  <section id="playScreen" class="screen">
    <div id="chancesHud" class="chances-hud">剩餘機會：3</div>
    <div id="introPrompt" class="intro-prompt">沉罐毳被困在黑暗中，<br>快救救他！</div>
  </section>

  <!-- 3. 恐怖女鬼 Jump Scare 層 -->
  <div id="jumpscareLayer" class="jumpscare-layer">
    <img class="jumpscare-img" src="ghost_jumpscare.jpg" alt="恐怖女鬼">
  </div>

  <!-- 4. 成功救援畫面 -->
  <section id="successScreen" class="screen">
    <div class="rescue-card">
      <div class="rescue-photo-wrap">
        <img src="chen_rescued.jpg" alt="獲救的沉罐毳">
      </div>
      <div class="rescue-title">恭喜！你終於把沉罐毳救出來了！</div>
      <div class="rescue-sub" id="successStats">你在第 1 次點擊就成功找到他！</div>
      <button id="retrySuccessBtn" class="btn-success">再玩一次 🔄</button>
    </div>
  </section>

  <!-- 5. 救援失敗畫面 -->
  <section id="failScreen" class="screen">
    <div class="fail-title">救援失敗……</div>
    <p class="fail-desc">三次機會全數用盡。<br>沉罐毳依然被困在無盡的黑暗之中，而女鬼已經找上你了……</p>
    <button id="retryFailBtn" class="btn-primary">重新挑戰 🔄</button>
  </section>

<script>
(() => {
  // 預載圖片，確保觸發 Jump Scare 零延遲
  ['ghost_jumpscare.jpg', 'chen_rescued.jpg'].forEach(src => {
    const img = new Image();
    img.src = src;
  });

  const startScreen    = document.getElementById('startScreen');
  const playScreen     = document.getElementById('playScreen');
  const successScreen  = document.getElementById('successScreen');
  const failScreen     = document.getElementById('failScreen');

  const startBtn       = document.getElementById('startBtn');
  const retrySuccessBtn = document.getElementById('retrySuccessBtn');
  const retryFailBtn   = document.getElementById('retryFailBtn');

  const chancesHud     = document.getElementById('chancesHud');
  const introPrompt    = document.getElementById('introPrompt');
  const jumpscareLayer = document.getElementById('jumpscareLayer');
  const successStats   = document.getElementById('successStats');

  let audioCtx = null;
  let state = 'idle'; // idle | intro | searching | scare | ended
  let targetX = 0;
  let targetY = 0;
  let hitRadius = 56;
  let chancesLeft = 3;
  let attempts = 0;
  let introTimer = null;
  let scareTimer = null;

  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // 合成極度突發刺耳的恐怖女鬼尖嘯＋重低音衝擊音效
  function playJumpScareSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const dur = 1.35;

    // 1. 不和諧高頻尖嘯群
    const freqs = [740, 815, 1180, 1490];
    freqs.forEach((f, idx) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = idx % 2 === 0 ? 'sawtooth' : 'square';
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.exponentialRampToValueAtTime(f * 0.62, now + dur);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.28, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur);
    });

    // 2. 重低音驚悚轟鳴
    const sub = audioCtx.createOscillator();
    const subGain = audioCtx.createGain();
    sub.type = 'triangle';
    sub.frequency.setValueAtTime(95, now);
    sub.frequency.exponentialRampToValueAtTime(34, now + 0.9);
    subGain.gain.setValueAtTime(0.85, now);
    subGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
    sub.connect(subGain);
    subGain.connect(audioCtx.destination);
    sub.start(now);
    sub.stop(now + 1.0);

    // 3. 爆裂白噪音
    const bufSize = Math.floor(audioCtx.sampleRate * 0.8);
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.25));
    }
    const noise = audioCtx.createBufferSource();
    const nGain = audioCtx.createGain();
    noise.buffer = buf;
    nGain.gain.setValueAtTime(0.55, now);
    nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
    noise.connect(nGain);
    nGain.connect(audioCtx.destination);
    noise.start(now);
  }

  function playRescueSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.08);
      gain.gain.setValueAtTime(0.001, now + i * 0.08);
      gain.gain.linearRampToValueAtTime(0.22, now + i * 0.08 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + i * 0.08);
      osc.stop(now + i * 0.08 + 0.48);
    });
  }

  function showScreen(target) {
    [startScreen, playScreen, successScreen, failScreen].forEach(s => s.classList.remove('active'));
    target.classList.add('active');
  }

  function randomizeTarget() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    // 避開最邊緣 14%，並維持合理觸控命中半徑（短邊的 14%，至少 48px）
    hitRadius = Math.max(48, Math.round(Math.min(w, h) * 0.14));
    const marginX = Math.max(hitRadius, w * 0.14);
    const marginYTop = Math.max(hitRadius + 40, h * 0.16);
    const marginYBottom = Math.max(hitRadius, h * 0.14);

    targetX = marginX + Math.random() * Math.max(10, w - marginX * 2);
    targetY = marginYTop + Math.random() * Math.max(10, h - marginYTop - marginYBottom);
  }

  function startGame() {
    unlockAudio();
    clearTimeout(introTimer);
    clearTimeout(scareTimer);
    jumpscareLayer.classList.remove('active');

    chancesLeft = 3;
    attempts = 0;
    chancesHud.textContent = `剩餘機會：${chancesLeft}`;
    randomizeTarget();

    state = 'intro';
    showScreen(playScreen);
    introPrompt.classList.add('visible');

    introTimer = setTimeout(() => {
      introPrompt.classList.remove('visible');
      state = 'searching';
    }, 1600);
  }

  function triggerJumpScare() {
    state = 'scare';
    chancesLeft -= 1;
    chancesHud.textContent = `剩餘機會：${chancesLeft}`;

    // 重新觸發動畫與音效
    const img = jumpscareLayer.querySelector('.jumpscare-img');
    img.style.animation = 'none';
    void img.offsetWidth;
    img.style.animation = '';

    jumpscareLayer.classList.add('active');
    playJumpScareSound();
    if (navigator.vibrate) navigator.vibrate([120, 40, 220, 40, 180]);

    scareTimer = setTimeout(() => {
      jumpscareLayer.classList.remove('active');
      if (chancesLeft <= 0) {
        state = 'ended';
        showScreen(failScreen);
      } else {
        state = 'searching';
      }
    }, 1500);
  }

  function handleSearchTap(clientX, clientY) {
    if (state !== 'searching') return;
    attempts += 1;

    const dx = clientX - targetX;
    const dy = clientY - targetY;
    const dist = Math.hypot(dx, dy);

    if (dist <= hitRadius) {
      state = 'ended';
      playRescueSound();
      successStats.textContent = `你在第 ${attempts} 次尋找成功救出沉罐毳！`;
      showScreen(successScreen);
    } else {
      triggerJumpScare();
    }
  }

  // 同時支援手機觸控與電腦滑鼠點擊（避免 touchstart + click 雙重觸發）
  let touchHandled = false;
  playScreen.addEventListener('touchstart', (e) => {
    if (state !== 'searching') return;
    touchHandled = true;
    const t = e.touches[0];
    if (t) handleSearchTap(t.clientX, t.clientY);
  }, { passive: true });

  playScreen.addEventListener('click', (e) => {
    if (touchHandled) {
      touchHandled = false;
      return;
    }
    handleSearchTap(e.clientX, e.clientY);
  });

  startBtn.addEventListener('click', startGame);
  retrySuccessBtn.addEventListener('click', startGame);
  retryFailBtn.addEventListener('click', startGame);
})();
</script>
</body>
</html>
